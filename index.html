<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神奇树屋 · 一周一章俱乐部 | Dinosaurs Before Dark</title>
<style>
:root{
  --green:#2f7d4f; --green-lt:#e6f3ea; --brown:#6b4f2e; --orange:#e8842a;
  --line:#e5dccd; --paper:#faf6ef;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:#3a332b;}
.hero{background:linear-gradient(158deg,#2f7d4f 0%,#3e9a63 52%,#63b87f 100%);color:#fff;padding:36px 16px 40px;text-align:center;border-radius:0 0 22px 22px;}
.hero .kicker{font-size:13px;letter-spacing:4px;color:rgba(255,255,255,.82);font-weight:800;}
.hero h1{font-size:34px;margin:8px 0 6px;letter-spacing:2px;}
.hero .sub{font-size:15px;color:rgba(255,255,255,.92);}
.hero .book{margin-top:10px;font-size:14px;color:rgba(255,255,255,.78);}
.wrap{max-width:960px;margin:0 auto;padding:22px 14px 40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:block;box-shadow:0 4px 14px rgba(43,38,32,.06);transition:transform .18s,box-shadow .18s;position:relative;}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(43,38,32,.13);}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f2ece1;}
.cbody{padding:10px 12px 12px;}
.cnum{font-size:12px;font-weight:800;color:var(--orange);letter-spacing:1px;}
.ctitle{font-size:16px;font-weight:800;color:var(--brown);margin:2px 0 1px;line-height:1.3;}
.ctitlezh{font-size:13px;color:#8a7f6e;}
.pbar{height:6px;background:#efe7d8;border-radius:99px;margin-top:9px;overflow:hidden;}
.pfill{height:100%;background:var(--green);border-radius:99px;transition:width .3s;}
.pmeta{display:flex;justify-content:space-between;font-size:11px;color:#a3967f;margin-top:5px;}
.done-badge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.hint{text-align:center;color:#a3967f;font-size:13px;margin-top:26px;letter-spacing:1px;}
footer{text-align:center;color:#9a8f7d;font-size:12px;padding:20px 0 34px;}
@media(max-width:480px){.hero h1{font-size:27px;}.grid{grid-template-columns:repeat(2,1fr);gap:11px;}}
</style>
</head>
<body>
<header class="hero">
  <div class="kicker">ONE WEEK · ONE CHAPTER</div>
  <h1>🌳 神奇树屋</h1>
  <div class="sub">一周一章 · 听说读配全通关</div>
  <div class="book">第一本书《Dinosaurs Before Dark》恐龙谷大冒险 · 共 10 章</div>
</header>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="hint">⭐ 通关一章需要一周，点章节卡片开始冒险</div>
</div>
<footer>神奇树屋 · 一周一章俱乐部</footer>
<script>
const CHAPTERS=[
 [1,"Into the Woods","走进树林","assets/cover.jpg","mth_w1"],
 [2,"The Monster","怪物","assets/covers/ch2.jpg","mth_ch2"],
 [3,"Where Is Here?","这是哪里","assets/covers/ch3.jpg","mth_ch3"],
 [4,"Henry","亨利","assets/covers/ch4.jpg","mth_ch4"],
 [5,"Gold in the Grass","草地里的金子","assets/covers/ch5.jpg","mth_ch5"],
 [6,"Dinosaur Valley","恐龙谷","assets/covers/ch6.jpg","mth_ch6"],
 [7,"Ready, Set, Go!","预备——跑！","assets/covers/ch7.jpg","mth_ch7"],
 [8,"A Giant Shadow","巨大的影子","assets/covers/ch8.jpg","mth_ch8"],
 [9,"The Amazing Ride","奇妙之旅","assets/covers/ch9.jpg","mth_ch9"],
 [10,"Home Before Dark","天黑前回家","assets/covers/ch10.jpg","mth_ch10"]
];
const grid=document.getElementById("grid");
CHAPTERS.forEach(([n,en,zh,cover,key])=>{
  let done=0;
  try{const st=JSON.parse(localStorage.getItem(key)||"{}");done=Object.keys(st.done||{}).length;}catch(e){}
  const pct=Math.round(done/5*100);
  const a=document.createElement("a");
  a.className="card";a.href=`ch${n}.html`;
  a.innerHTML=`<img src="${cover}" alt="第${n}章封面" loading="lazy">
    ${done>=5?'<div class="done-badge">✓ 通关</div>':""}
    <div class="cbody">
      <div class="cnum">第 ${n} 章</div>
      <div class="ctitle">${en}</div>
      <div class="ctitlezh">${zh}</div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      <div class="pmeta"><span>${done}/5 关</span><span>${pct}%</span></div>
    </div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
